# Пример конфигурации nginx для выкладки АС «БЖА».
# Фронтенд и API открываются с одного адреса — CORS не нужен.
#
# 1. Скопируйте содержимое папки frontend/ в /var/www/bja
# 2. В /var/www/bja/js/config.js поставьте USE_MOCK: false, BASE_URL: '/api/v1'
# 3. Замените bja.example.ru и пути к сертификату, порт бэкенда (здесь 8000)
# 4. sudo cp deploy/nginx.conf /etc/nginx/sites-available/bja && sudo ln -s ../sites-available/bja /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name bja.example.ru;
    return 301 https://$host$request_uri;          # только HTTPS, п. 4.4.8 ТЗ
}

server {
    listen 443 ssl http2;
    server_name bja.example.ru;

    ssl_certificate     /etc/letsencrypt/live/bja.example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bja.example.ru/privkey.pem;

    root  /var/www/bja;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'" always;

    # API → бэкенд
    location /api/ {
        # Сервисный режим (п. 4.1.4): создайте файл /var/www/bja/maintenance.on — API начнёт отвечать 503,
        # фронтенд покажет «Идут технические работы». Удалите файл — всё заработает.
        if (-f $document_root/maintenance.on) { return 503; }
        error_page 503 = @maintenance;
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 1m;
    }

    location @maintenance {
        default_type application/json;
        return 503 '{"error":{"code":"MAINTENANCE","message":"Идут технические работы. Данные сохранены, попробуйте позже"}}';
    }

    # config.js не кэшируем, чтобы смена адреса API применялась сразу
    location = /js/config.js { expires -1; }
    location ~* \.(css|js|png|svg)$ { expires 1h; }

    # Демо-данные в рабочей версии не нужны
    location = /js/mock-data.js { return 404; }
}
